<h2>Wissensquiz: Passwort zurücksetzen</h2>
<p>Öffne den Link, um ein neues Passwort festzulegen. Der Link ist zeitlich begrenzt und nur einmal verwendbar.</p>
<p><a href="{{ .SiteURL }}/#auth?token_hash={{ .TokenHash }}&amp;type=recovery">Neues Passwort festlegen</a></p>
<p>Wenn Du kein neues Passwort angefordert hast, ignoriere diese Nachricht. Dein Passwort bleibt unverändert.</p>
